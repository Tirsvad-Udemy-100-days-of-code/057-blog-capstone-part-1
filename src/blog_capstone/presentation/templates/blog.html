{% extends "base.html" %}
{% block content %}
<div class="content">
    <p class="text">Blog number {{ num }}</p>
    {% if posts %}
    {% for post in posts %}
    <div class="card">
        <h2>{{ post.title }}</h2>
        <p class="text">{{ post.subtitle }}</p>
    </div>
    {% endfor %}
    {% else %}
    <p class="text">No posts yet.</p>
    {% endif %}
</div>
{% endblock %}
